<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0fa64f" />
  <title>Check Invoice — Wegene Family Mahaber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,500&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="invoice-page">
  <section class="login-screen" id="login-screen">
    <div class="login-card" id="login-card">
      <img class="site-logo login-logo" src="assets/images/wegene-logo.png" alt="Wegene logo" />
      <h1>Wegene Family Mahaber</h1>
      <p>Member-only area. Enter the shared member password to continue.</p>
      <label for="member-password">Shared member password</label>
      <input type="password" id="member-password" autocomplete="current-password" />
      <button type="button" id="login-button">Enter</button>
      <p class="error" id="login-error" hidden>Incorrect password. Please try again.</p>
    </div>
  </section>

  <div id="app-shell" hidden>
    <div class="menu-bar">
      <div class="menu-bar-inner">
        <a class="menu-brand" href="index.html">
          <img class="menu-logo" src="assets/images/wegene-logo.png" alt="" />
          <span>Wegene</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
          <span class="menu-toggle-bars" aria-hidden="true"></span>
          <span class="menu-toggle-label">Menu</span>
        </button>
        <nav class="site-menu" id="site-menu" aria-label="Main">
          <a href="index.html">Tracker</a>
          <a href="invoice.html" class="is-active" aria-current="page">Check Invoice</a>
          <a href="admin.html">Admin tools</a>
          <button class="menu-logout" id="logout-button" type="button">Log out</button>
        </nav>
      </div>
    </div>

    <header class="page-header invoice-hero">
      <div class="page-title-row">
        <img class="site-logo header-logo" src="assets/images/wegene-logo.png" alt="Wegene logo" />
        <div class="invoice-hero-copy">
          <p class="invoice-kicker">Wegene Family Mahaber</p>
          <h1>Check Invoice</h1>
          <p class="invoice-sub">Select your name to see unpaid dues and pay on PayPal.</p>
        </div>
      </div>
    </header>

    <main class="stack invoice-main">
      <section class="card stack invoice-panel">
        <div class="invoice-toolbar">
          <p id="invoice-summary" class="invoice-summary">Loading names…</p>
          <button type="button" class="ghost" id="invoice-refresh">Refresh</button>
        </div>

        <label class="invoice-select-label" for="invoice-member-select">Your name</label>
        <select id="invoice-member-select" disabled>
          <option value="">Choose your name…</option>
        </select>

        <div id="invoice-error" class="notice notice-error" hidden></div>
        <div id="invoice-results" class="invoice-results" hidden></div>
      </section>
    </main>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/invoice.js"></script>
</body>
</html>
